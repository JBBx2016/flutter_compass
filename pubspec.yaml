name: flutter_compass
description: A Flutter compass with magnetic heading and sensor accuracy events for Android and iOS.
version: 0.8.2
homepage: https://github.com/hemanthrajv/flutter_compass
repository: https://github.com/JBBx2016/flutter_compass

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.hemanthraj.fluttercompass
        pluginClass: FlutterCompassPlugin
      ios:
        pluginClass: SwiftFlutterCompassPlugin
