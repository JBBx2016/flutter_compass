name: flutter_compass_example
description: Demonstrates how to use the flutter_compass plugin.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_compass:
    path: ../
  # 13.x requires Android SDK 37; keep this example on the consumer's SDK 36.
  permission_handler: ^12.0.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/compass.jpg
